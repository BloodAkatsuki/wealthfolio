name: HTTP client policy

on:
  pull_request:
    paths:
      - "crates/http/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/http-client-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tls:
    name: TLS verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restore only: a PR's copy is readable only by that PR and competes
          # with the shared caches cache-warm.yml seeds on main.
          save-if: false
      - name: Test certificate policy and HTTP behavior
        run: cargo test --locked -p wealthfolio-http
