name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CONNECT_STORAGE_ALLOWED_HOSTS:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android target for the repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-release
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Initialize local Android build files
        run: |
          pnpm tauri android init --ci --skip-targets-install
          git restore -- apps/tauri/gen/android
      - name: Check Connect build configuration
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_STORAGE_ALLOWED_HOSTS: ${{ secrets.CONNECT_STORAGE_ALLOWED_HOSTS }}
        run: python3 .github/scripts/check_connect_build.py --github-env

      - name: Build release-mode ARM64 APK
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_API_URL: ${{ vars.CONNECT_API_URL }}
          CONNECT_OAUTH_CALLBACK_URL: ${{ vars.CONNECT_OAUTH_CALLBACK_URL }}
        run: pnpm tauri android build --ci --apk --target aarch64 -- --locked
      - name: Sign APK for testing
        # A per-run test key makes the APK installable without production secrets.
        # It cannot update store installs or APKs signed by another run.
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test.keystore" \
            -storepass android -keypass android -alias androidtestkey \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Wealthfolio CI Test"
          apk=$(find apps/tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk')
          test -f "$apk"
          mkdir -p artifacts
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/test.keystore" \
            --ks-key-alias androidtestkey --ks-pass pass:android --key-pass pass:android \
            --out artifacts/wealthfolio-android-arm64-test.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose artifacts/wealthfolio-android-arm64-test.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wealthfolio-android-arm64-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
