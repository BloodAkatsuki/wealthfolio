name: Build Mobile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android release APK
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
  ios:
    name: iOS unsigned archive
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install iOS targets for the repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
      - name: Check iOS device compilation
        run: |
          mkdir -p dist
          printf '<!DOCTYPE html><html></html>' > dist/index.html
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Initialize local iOS build files
        run: |
          brew install xcodegen
          node apps/tauri/scripts/sync-ios-composer-icon.mjs
          pnpm tauri ios init --ci --skip-targets-install
          # Keep reviewed project customizations and generated local dependency files.
          git restore -- apps/tauri/gen/apple
      - name: Build unsigned iOS simulator archive
        run:
          pnpm tauri ios build --ci --debug --no-sign --archive-only --target aarch64-sim --
          --locked
      - name: Upload simulator archive
        run:
          tar -czf "$RUNNER_TEMP/wealthfolio-ios-simulator.tar.gz" -C apps/tauri/gen/apple/build
          wealthfolio-app_iOS.xcarchive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wealthfolio-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/wealthfolio-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
